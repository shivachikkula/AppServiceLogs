name: Deploy to Azure App Service

# Builds the Angular client and the .NET API into one package (dotnet publish copies the Angular build into
# wwwroot) and deploys it to a single App Service. Setup: see "Deployment" in README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test API
        run: dotnet test backend --configuration Release

      - name: Publish API + client
        run: dotnet publish backend/AppInsightsLogs.Api --configuration Release --output "${{ runner.temp }}/app"

      - name: Check that the client was bundled
        run: test -f "${{ runner.temp }}/app/wwwroot/index.html"

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: ${{ runner.temp }}/app
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OpenID Connect sign-in to Azure (no stored Azure password)
    environment:
      name: production
      url: ${{ steps.deploy-oidc.outputs.webapp-url || steps.deploy-profile.outputs.webapp-url }}
    steps:
      - name: Check configuration
        env:
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if [ -z "$WEBAPP_NAME" ]; then
            echo "::error::Set the repository variable AZURE_WEBAPP_NAME (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: app
          path: app

      # Option A (recommended): OpenID Connect with a federated credential. Used when AZURE_CLIENT_ID is set.
      - name: Sign in to Azure (OpenID Connect)
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy (OpenID Connect)
        id: deploy-oidc
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app

      # Option B: the App Service publish profile stored as a secret. Used when AZURE_CLIENT_ID is not set.
      - name: Deploy (publish profile)
        id: deploy-profile
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app
