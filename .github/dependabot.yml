# Weekly pull requests for outdated or vulnerable dependencies (free).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]
      other:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "@angular-eslint/*"]

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
